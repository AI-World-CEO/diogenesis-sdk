[project]
name = "diogenesis-sdk"
version = "0.2.0"
description = "Behavioral immune system for AI applications. Runtime monitoring, anomaly detection, and self-healing for autonomous AI agents."
authors = [{name = "Garry Anderson", email = "prnt3dman1@gmail.com"}]
license = "Apache-2.0"
requires-python = ">=3.8"
dependencies = []
readme = "README.md"
keywords = ["ai", "security", "monitoring", "behavioral", "immune-system", "runtime", "agent", "safety", "anomaly-detection", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://diogenicsecurity.com"
Documentation = "https://diogenicsecurity.com"
Source = "https://github.com/AI-World-CEO/diogenesis-sdk"
"Bug Tracker" = "https://github.com/AI-World-CEO/diogenesis-sdk/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
